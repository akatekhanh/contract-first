<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 624" width="1240" height="624" role="img" aria-label="One Repo, Every Harness and Model">
  
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .title { font-size: 24px; font-weight: 700; fill: #2d3142; }
      .subtitle { font-size: 13px; font-weight: 400; fill: #7a8399; }
      .eyebrow-muted { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; fill: #7a8399; }
      .eyebrow-accent { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; fill: #eb6c36; }
      .node-title { font-size: 13.5px; font-weight: 600; fill: #2d3142; }
      .node-sub { font-size: 12px; font-weight: 400; fill: #4f5d75; }
      .node-title-inv { font-size: 14px; font-weight: 700; fill: #ffffff; }
      .node-sub-inv { font-size: 12px; font-weight: 400; fill: #cbd5e1; }

      @keyframes dashFlow {
        to { stroke-dashoffset: -24; }
      }
      @keyframes softPulse {
        0%, 100% { stroke-opacity: 0.55; stroke-width: 2.2; }
        50% { stroke-opacity: 1; stroke-width: 3.2; }
      }
      @keyframes softGlow {
        0%, 100% { filter: drop-shadow(0 0 0px rgba(235, 108, 54, 0)); }
        50% { filter: drop-shadow(0 0 8px rgba(235, 108, 54, 0.35)); }
      }
      @keyframes subtleWobble {
        0%, 100% { transform: translateX(0px); }
        25% { transform: translateX(-1.5px); }
        75% { transform: translateX(1.5px); }
      }
      .flow-dash { stroke-dasharray: 6 6; animation: dashFlow 1.4s linear infinite; }
      .flow-dash-accent { stroke-dasharray: 7 5; animation: dashFlow 1.1s linear infinite; }
      .gate-pulse { animation: softPulse 2.4s ease-in-out infinite; }
      .ssot-glow { animation: softGlow 3s ease-in-out infinite; }
      .drift-wobble { animation: subtleWobble 2.8s ease-in-out infinite; }
    </style>

  
    <defs>
      <marker id="arr-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#7a8399"/>
      </marker>
      <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#4f5d75"/>
      </marker>
      <marker id="arr-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#2d3142"/>
      </marker>
      <marker id="arr-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#eb6c36"/>
      </marker>
    </defs>

  <rect x="0" y="0" width="1240" height="624" rx="16" fill="#f5f5f5"/>

  <!-- Header -->
  <text x="40" y="48" class="sans title">One Repo · Every Harness &amp; Model</text>
  <text x="40" y="72" class="sans subtitle">Install once, orchestrate any provider or model tier under one contract</text>

  <!-- Focal repo hub -->
  <g class="ssot-glow">
    <rect x="360" y="104" width="520" height="74" rx="10" fill="#fff4ee" stroke="#eb6c36" stroke-width="2"/>
    <text x="620" y="136" text-anchor="middle" class="mono node-title" font-weight="700">akatekhanh/contract-first</text>
    <text x="620" y="158" text-anchor="middle" class="sans node-sub">skills/ · Zero-Dep Scripts · 7 Native Manifests</text>
  </g>

  <!-- 6 Harnesses -->
  <rect x="40" y="244" width="176" height="64" rx="10" fill="#ffffff" stroke="#bfc0c0" stroke-width="1.5"/>
  <text x="128" y="281" text-anchor="middle" class="sans node-title">Antigravity (agy)</text>
  <rect x="237" y="244" width="176" height="64" rx="10" fill="#ffffff" stroke="#bfc0c0" stroke-width="1.5"/>
  <text x="325" y="281" text-anchor="middle" class="sans node-title">Claude Code</text>
  <rect x="434" y="244" width="176" height="64" rx="10" fill="#ffffff" stroke="#bfc0c0" stroke-width="1.5"/>
  <text x="522" y="281" text-anchor="middle" class="sans node-title">Codex CLI / App</text>
  <rect x="631" y="244" width="176" height="64" rx="10" fill="#ffffff" stroke="#bfc0c0" stroke-width="1.5"/>
  <text x="719" y="281" text-anchor="middle" class="sans node-title">Cursor</text>
  <rect x="828" y="244" width="176" height="64" rx="10" fill="#ffffff" stroke="#bfc0c0" stroke-width="1.5"/>
  <text x="916" y="281" text-anchor="middle" class="sans node-title">Gemini CLI</text>
  <rect x="1025" y="244" width="176" height="64" rx="10" fill="#ffffff" stroke="#bfc0c0" stroke-width="1.5"/>
  <text x="1113" y="281" text-anchor="middle" class="sans node-title">OpenCode / Hermes</text>

  <!-- 3 Model Tiers -->
  <rect x="40" y="376" width="368" height="86" rx="10" fill="#ffffff" stroke="#4f5d75" stroke-width="1.5"/>
  <text x="224" y="413" text-anchor="middle" class="sans node-title">Frontier → Architect</text>
  <text x="224" y="435" text-anchor="middle" class="sans node-sub">Opus · Gemini Pro · GPT-5 High</text>

  <rect x="436" y="376" width="368" height="86" rx="10" fill="#ffffff" stroke="#4f5d75" stroke-width="1.5"/>
  <text x="620" y="413" text-anchor="middle" class="sans node-title">Balanced → Parallel Builders</text>
  <text x="620" y="435" text-anchor="middle" class="sans node-sub">Sonnet · Gemini Pro · Codex</text>

  <rect x="832" y="376" width="368" height="86" rx="10" fill="#ffffff" stroke="#4f5d75" stroke-width="1.5"/>
  <text x="1016" y="413" text-anchor="middle" class="sans node-title">Cross-Model → Reviewer</text>
  <text x="1016" y="435" text-anchor="middle" class="sans node-sub">Separate model family diff check</text>

  <!-- Shared Contract Gate -->
  <rect x="220" y="524" width="800" height="74" rx="10" fill="#2d3142" stroke="#eb6c36" stroke-width="2.5" class="gate-pulse"/>
  <text x="620" y="556" text-anchor="middle" class="sans node-title-inv">Shared Contract Gate</text>
  <text x="620" y="578" text-anchor="middle" class="sans node-sub-inv">Any model writes code · The contract decides if it merges</text>

  <!-- Connectors -->
  <path d="M 438 178 L 438 210 L 128 210 L 128 240" fill="none" stroke="#eb6c36" stroke-width="1.8" stroke-opacity="0.7" marker-end="url(#arr-accent)"/>
  <path d="M 516 178 L 516 210 L 325 210 L 325 240" fill="none" stroke="#eb6c36" stroke-width="1.8" stroke-opacity="0.7" marker-end="url(#arr-accent)"/>
  <path d="M 588 178 L 588 210 L 522 210 L 522 240" fill="none" stroke="#eb6c36" stroke-width="1.8" stroke-opacity="0.7" marker-end="url(#arr-accent)"/>
  <path d="M 652 178 L 652 210 L 719 210 L 719 240" fill="none" stroke="#eb6c36" stroke-width="1.8" stroke-opacity="0.7" marker-end="url(#arr-accent)"/>
  <path d="M 724 178 L 724 210 L 916 210 L 916 240" fill="none" stroke="#eb6c36" stroke-width="1.8" stroke-opacity="0.7" marker-end="url(#arr-accent)"/>
  <path d="M 802 178 L 802 210 L 1113 210 L 1113 240" fill="none" stroke="#eb6c36" stroke-width="1.8" stroke-opacity="0.7" marker-end="url(#arr-accent)"/>
  <path d="M 128 308 L 128 371" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#arr-slate)"/>
  <path d="M 325 308 L 325 371" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#arr-slate)"/>
  <path d="M 522 308 L 522 371" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#arr-slate)"/>
  <path d="M 719 308 L 719 371" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#arr-slate)"/>
  <path d="M 916 308 L 916 371" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#arr-slate)"/>
  <path d="M 1113 308 L 1113 371" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#arr-slate)"/>
  <path d="M 224 462 L 224 494 L 380 494 L 380 520" fill="none" stroke="#2d3142" stroke-width="2" marker-end="url(#arr-ink)"/>
  <path d="M 620 462 L 620 520" fill="none" stroke="#2d3142" stroke-width="2" marker-end="url(#arr-ink)"/>
  <path d="M 1016 462 L 1016 494 L 860 494 L 860 520" fill="none" stroke="#2d3142" stroke-width="2" marker-end="url(#arr-ink)"/>

  <!-- Animated flow particles -->
  <circle r="3.0" fill="#eb6c36" opacity="0.9">
      <animateMotion dur="1.9s" begin="0.0s" repeatCount="indefinite" path="M 438 178 L 438 210 L 128 210 L 128 240"/>
    </circle> <circle r="3.0" fill="#eb6c36" opacity="0.9">
      <animateMotion dur="1.9s" begin="0.2s" repeatCount="indefinite" path="M 516 178 L 516 210 L 325 210 L 325 240"/>
    </circle> <circle r="3.0" fill="#eb6c36" opacity="0.9">
      <animateMotion dur="1.9s" begin="0.4s" repeatCount="indefinite" path="M 588 178 L 588 210 L 522 210 L 522 240"/>
    </circle> <circle r="3.0" fill="#eb6c36" opacity="0.9">
      <animateMotion dur="1.9s" begin="0.6s" repeatCount="indefinite" path="M 652 178 L 652 210 L 719 210 L 719 240"/>
    </circle> <circle r="3.0" fill="#eb6c36" opacity="0.9">
      <animateMotion dur="1.9s" begin="0.8s" repeatCount="indefinite" path="M 724 178 L 724 210 L 916 210 L 916 240"/>
    </circle> <circle r="3.0" fill="#eb6c36" opacity="0.9">
      <animateMotion dur="1.9s" begin="1.0s" repeatCount="indefinite" path="M 802 178 L 802 210 L 1113 210 L 1113 240"/>
    </circle> <circle r="2.8" fill="#4f5d75" opacity="0.9">
      <animateMotion dur="1.5s" begin="0.0s" repeatCount="indefinite" path="M 128 308 L 128 372"/>
    </circle> <circle r="2.8" fill="#4f5d75" opacity="0.9">
      <animateMotion dur="1.5s" begin="0.2s" repeatCount="indefinite" path="M 325 308 L 325 372"/>
    </circle> <circle r="2.8" fill="#4f5d75" opacity="0.9">
      <animateMotion dur="1.5s" begin="0.4s" repeatCount="indefinite" path="M 522 308 L 522 372"/>
    </circle> <circle r="2.8" fill="#4f5d75" opacity="0.9">
      <animateMotion dur="1.5s" begin="0.5s" repeatCount="indefinite" path="M 719 308 L 719 372"/>
    </circle> <circle r="2.8" fill="#4f5d75" opacity="0.9">
      <animateMotion dur="1.5s" begin="0.7s" repeatCount="indefinite" path="M 916 308 L 916 372"/>
    </circle> <circle r="2.8" fill="#4f5d75" opacity="0.9">
      <animateMotion dur="1.5s" begin="0.9s" repeatCount="indefinite" path="M 1113 308 L 1113 372"/>
    </circle> <circle r="3.2" fill="#2d3142" opacity="0.9">
      <animateMotion dur="1.6s" begin="0.0s" repeatCount="indefinite" path="M 224 462 L 224 494 L 380 494 L 380 520"/>
    </circle> <circle r="3.2" fill="#2d3142" opacity="0.9">
      <animateMotion dur="1.6s" begin="0.3s" repeatCount="indefinite" path="M 620 462 L 620 520"/>
    </circle> <circle r="3.2" fill="#2d3142" opacity="0.9">
      <animateMotion dur="1.6s" begin="0.6s" repeatCount="indefinite" path="M 1016 462 L 1016 494 L 860 494 L 860 520"/>
    </circle>
</svg>
